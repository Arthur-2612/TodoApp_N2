name: Pipeline de CI

on: 
  push:
    branches:
      ["main"]
  pull_request:
    branches:
      - main

jobs: 
  testes-unitarios:
    name: Testes unitarios
    runs-on: ubuntu-latest
    steps: 
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Linguagem - Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          pytest tests/unit


  testes-integracao:
    name: Testes de Integracao
    runs-on: ubuntu-latest
    steps: 
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Linguagem - Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          pytest tests/integracao


  testes-end-to-end:
    name: Testes de End-to-End
    runs-on: ubuntu-latest
    steps: 
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Linguagem - Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: |
          pytest tests/end_to_end